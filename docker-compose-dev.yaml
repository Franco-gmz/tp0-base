name: tp0
services:
  server:
    container_name: server
    image: server:latest
    volumes:
      - ./server/config.ini:/server/config.ini
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - testing_net
  client1:
    container_name: client1
    image: client:latest
    volumes:
      - ./client/config.ini:/config.ini
    entrypoint: python3 /main.py
    environment:
      - CLI_ID=1
      - NOMBRE=NOMBRE1
      - APELLIDO=APELLIDO1
      - DOCUMENTO=11111111
      - NACIMIENTO=1998-01-04
      - NUMERO=1
    networks:
      - testing_net
    depends_on:
      - server


networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
